# Answers to the review queue (out/nordic_supply/REVIEW.md). Applied deterministically at the end of every
# generation, before files are written; `approve` only records that a human looked at the item.
#   id      as in the queue: doc:<path> | anchor:<group>.<key> | row:<table>.<business key>.<column> | template:<table>.<column>:<sig>
#   action  approve | reject (blank the field) | replace (set `value`)
# Ids of rows and anchors are stable for a given config, seed and as-of; regenerating with another date
# changes them, template ids do not.

