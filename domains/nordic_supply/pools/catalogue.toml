# Catalogue structure for Nordic Supply: categories with product-type templates, suppliers, naming pools,
# variant pools, warehouses, users, seasonality. Generated from the original Python constants; edit freely.
#
# Variant kinds (types[].kind): PERSONS TEMP LITRES LITRES_SMALL LITRES_BIG SHOE SIZE COLOR GAS ROPE LENGTH NONE
# season: SPRING SUMMER AUTUMN WINTER ALL

[naming]
model_names = ["Storm", "Ridge", "Summit", "Glacier", "Tundra", "Fjord", "Nordvik", "Kero", "Suvanto", "Kaira", "Selkä", "Pallas", "Ylläs", "Skare", "Rauk", "Joki", "Aapa", "Kulku", "Palsa", "Loiste", "Selja", "Varanger", "Kilpis", "Inari", "Kaldo", "Polar", "Trail", "Ultra", "Alpine", "Nordic", "Arctic", "Revontuli", "Vinter", "Kaamos", "Ruska", "Nietos", "Myrsky", "Tuuli", "Vuori", "Kallio", "Fjell", "Bre", "Elv", "Skog", "Hav", "Vuoma", "Tind", "Nuten", "Kuru", "Sylarna", "Hyrsky", "Åreskutan"]
lines = ["", "", "", " Pro", " Lite", " XT", " Plus", " Eco", " WP", " II", " 2.0"]
colors = ["Moss Green", "Slate Grey", "Burnt Orange", "Midnight Blue", "Sand", "Black", "Ruby Red", "Arctic White", "Forest", "Ochre", "Petrol", "Lichen", "Graphite", "Sunset Yellow", "Deep Teal"]

[variants]
PERSONS = ["1P", "2P", "3P", "4P"]
TEMP = ["+5°C", "0°C", "-5°C", "-10°C", "-20°C"]
LITRES = ["35L", "45L", "55L", "65L", "75L"]
LITRES_SMALL = ["8L", "12L", "18L", "22L", "28L"]
LITRES_BIG = ["40L", "60L", "90L", "120L"]
SHOE = ["EU 37", "EU 38", "EU 39", "EU 40", "EU 41", "EU 42", "EU 43", "EU 44", "EU 45", "EU 46", "EU 47"]
SIZE = ["XS", "S", "M", "L", "XL", "XXL"]
COLOR = ["Moss Green", "Slate Grey", "Burnt Orange", "Midnight Blue", "Sand", "Black", "Ruby Red", "Arctic White", "Forest", "Ochre", "Petrol", "Lichen", "Graphite", "Sunset Yellow", "Deep Teal"]
GAS = ["100 g", "230 g", "450 g"]
ROPE = ["9.5 mm 60 m", "9.8 mm 70 m", "8.9 mm 60 m"]
LENGTH = ["150 cm", "160 cm", "170 cm", "180 cm", "105 cm", "115 cm", "125 cm", "135 cm", "210 cm", "220 cm"]

[units]
PERSONS = "pcs"
TEMP = "pcs"
LITRES = "pcs"
LITRES_SMALL = "pcs"
LITRES_BIG = "pcs"
SHOE = "pair"
SIZE = "pcs"
COLOR = "pcs"
GAS = "pcs"
ROPE = "pcs"
LENGTH = "pcs"
NONE = "pcs"

[season_factor]
SPRING = { 2 = 1.2, 3 = 1.6, 4 = 1.8, 5 = 1.6, 6 = 1.1 }
SUMMER = { 4 = 1.2, 5 = 1.6, 6 = 1.8, 7 = 1.4, 8 = 1.3 }
AUTUMN = { 8 = 1.5, 9 = 1.8, 10 = 1.6, 11 = 1.2 }
WINTER = { 9 = 1.5, 10 = 1.9, 11 = 2.0, 12 = 1.7, 1 = 1.4, 2 = 1.2 }
ALL = {  }
# season_factor: demand multiplier per calendar month; missing months = 0.55 for seasonal categories, 1.0 for ALL

[channels]
names = ["EDI", "PORTAL", "EMAIL", "PHONE"]

[delays]
reasons = ["Missed linehaul connection", "Vehicle breakdown", "Capacity shortage at terminal", "Weather: road closed", "Address query, awaiting receiver", "Customs documentation check"]

