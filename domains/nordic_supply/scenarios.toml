# Nordic Supply demo scenarios. Each scenario points at an anchor record the lifecycle builds
# (manifest.anchors.<anchors_group>.<key>), the document rendered for it, the image(s) generated for it,
# and what the verifier must find. Placeholders {field} come from the anchor plus lifecycle.document_context().
#
# expect kinds: sql_zero | sql_one | sql_positive (SQLite SQL with {field} placeholders),
#               weekday (field, weekday), min (field, min), before_as_of (field), document_contains (must, must_not)

[scenarios]
anchors_group = "case2"

[[scenario]]
key = "A1_damaged_pallet"
case = "2"
title = "Damaged pallet (the business-case document's example)"
document = "emails/01-damaged-pallet-retkiaitta-tampere.eml"
exercises = "Order number only in the quoted confirmation; 'Tuesday's delivery' and 'second pallet' resolve via shipments.delivered_at and shipment_lines.pallet_number = 2; photo attachment."
expected = "DAMAGED · REPLACEMENT · needed by Friday · claim lines = the pallet-2 lines"
expect = [
  { kind = "sql_one", name = "order exists", sql = "SELECT COUNT(*) FROM orders WHERE id = {order_id}" },
  { kind = "sql_zero", name = "no claim yet", sql = "SELECT COUNT(*) FROM claims WHERE order_id = {order_id}" },
  { kind = "sql_one", name = "contact e-mail resolves to the customer", sql = "SELECT COUNT(*) FROM customer_contacts WHERE email = '{contact_email}' AND customer_id = {customer_id}" },
  { kind = "before_as_of", field = "delivered_at" },
  { kind = "weekday", field = "delivered_at", weekday = "Tuesday" },
  { kind = "min", field = "pallet_count", min = 2 },
  { kind = "sql_positive", name = "pallet 2 has lines", sql = "SELECT COUNT(*) FROM shipment_lines WHERE shipment_id = {shipment_id} AND pallet_number = 2" },
  { kind = "document_contains", must = ["{order_number}", "{contact_email}", "{customer}", "second pallet", "Tuesday", "{first_pallet2_line}"] },
]
[[scenario.image]]
file = "photos/pallet2-damage.jpg"
caption = "Pallet 2 of {shipment_number}, delivered {tuesday} to {customer}"
prompt = """Realistic smartphone photo taken inside a small sports shop's back room in Finland. A wooden EUR pallet
with cardboard cartons of camping tents; the stretch wrap is torn open and the bottom cartons are crushed and
dented, one carton split showing a green tent bag. Cartons carry a plain fictional brand label 'Fjellvind'
and no other readable text or logos. Fluorescent lighting, slightly tilted framing, no people."""

[[scenario]]
key = "A2_missing_cartons"
case = "2"
title = "Missing cartons, no order number"
document = "emails/02-missing-cartons-trailhead-umea.eml"
exercises = "No order number at all: sender e-mail → customer, 'last Friday' → shipment; quantities in cartons vs. pairs."
expected = "MISSING_ITEMS · REDELIVERY or CREDIT · 18 pairs affected"
expect = [
  { kind = "sql_one", name = "order exists", sql = "SELECT COUNT(*) FROM orders WHERE id = {order_id}" },
  { kind = "sql_zero", name = "no claim yet", sql = "SELECT COUNT(*) FROM claims WHERE order_id = {order_id}" },
  { kind = "before_as_of", field = "delivered_at" },
  { kind = "weekday", field = "delivered_at", weekday = "Friday" },
  { kind = "document_contains", must = ["{customer}", "{boots_ordered}", "{boots_received}", "{first_product}"], must_not = ["{order_number}"] },
]

[[scenario]]
key = "A3_wrong_colour"
case = "2"
title = "Wrong colour delivered (portal message)"
document = "emails/03-wrong-colour-nordkapp-tromso-portal.txt"
exercises = "Terse portal message with order reference; wrong variant of the right product."
expected = "WRONG_ITEM · REPLACEMENT · full quantity · question about keeping the wrong stock"
expect = [
  { kind = "sql_one", name = "order exists", sql = "SELECT COUNT(*) FROM orders WHERE id = {order_id}" },
  { kind = "sql_zero", name = "no claim yet", sql = "SELECT COUNT(*) FROM claims WHERE order_id = {order_id}" },
  { kind = "before_as_of", field = "delivered_at" },
  { kind = "document_contains", must = ["{order_number}", "{ordered_colour}", "{received_colour}", "{customer}"] },
]

[[scenario]]
key = "A4_late_delivery"
case = "2"
title = "Late delivery, credit request, personal data in the text"
document = "emails/04-late-delivery-fjallbutiken-kiruna.eml"
exercises = "Promised vs. actual dates, carrier, percentage credit; contains a personal mobile number and a named employee (masking demo); account manager in Cc."
expected = "LATE_DELIVERY · CREDIT 10% of orders.total_net · HIGH"
expect = [
  { kind = "sql_one", name = "order exists", sql = "SELECT COUNT(*) FROM orders WHERE id = {order_id}" },
  { kind = "sql_zero", name = "no claim yet", sql = "SELECT COUNT(*) FROM claims WHERE order_id = {order_id}" },
  { kind = "before_as_of", field = "delivered_at" },
  { kind = "sql_one", name = "delivered after the promised date", sql = "SELECT COUNT(*) FROM shipments s JOIN orders o ON o.id = s.order_id WHERE s.id = {shipment_id} AND date(s.delivered_at) > o.promised_delivery_date" },
  { kind = "document_contains", must = ["{order_number}", "{promised_delivery}", "{delivered_date}", "{customer}", "personal mobile"] },
]

[[scenario]]
key = "A5_quality_defect_sv"
case = "2"
title = "Quality defect, written in Swedish"
language = "sv"
document = "emails/05-quality-defect-trailhead-umea-sv.eml"
exercises = "Non-English message; delivery three weeks ago; part of the quantity affected; return label requested."
expected = "QUALITY_DEFECT · REPLACEMENT · 6 affected"
expect = [
  { kind = "sql_one", name = "order exists", sql = "SELECT COUNT(*) FROM orders WHERE id = {order_id}" },
  { kind = "sql_zero", name = "no claim yet", sql = "SELECT COUNT(*) FROM claims WHERE order_id = {order_id}" },
  { kind = "before_as_of", field = "delivered_at" },
  { kind = "document_contains", must = ["{order_number}", "{delivered_date}", "{defective_qty} st", "{first_product}"] },
]

[[scenario]]
key = "A6_pricing_dispute"
case = "2"
title = "Pricing dispute (forwarded thread from accounts payable)"
document = "emails/06-pricing-dispute-sportmagasinet-aarhus.eml"
exercises = "Promotion existed but list price was charged; the difference is computable from promotions and order_lines."
expected = "PRICING_DISPUTE · CREDIT of the difference · LOW/NORMAL"
expect = [
  { kind = "sql_one", name = "order exists", sql = "SELECT COUNT(*) FROM orders WHERE id = {order_id}" },
  { kind = "sql_zero", name = "no claim yet", sql = "SELECT COUNT(*) FROM claims WHERE order_id = {order_id}" },
  { kind = "before_as_of", field = "delivered_at" },
  { kind = "sql_positive", name = "a promotion covered the order date", sql = "SELECT COUNT(*) FROM promotions pr JOIN order_lines ol ON ol.product_id = pr.product_id WHERE ol.order_id = {order_id} AND '{placed_date}' BETWEEN pr.starts_on AND pr.ends_on" },
  { kind = "document_contains", must = ["{order_number}", "{invoiced_unit_price}", "{expected_promo_price}", "{customer_number}", "{placed_date}"] },
]
