<rect x="1090" y="300" width="180" height="60" rx="4" fill="#DCEAF0"/>
<rect x="630" y="450" width="200" height="90" rx="4" fill="#FFFFFF"/>
<rect x="880" y="458" width="180" height="74" rx="4" fill="#FFFFFF"/>
