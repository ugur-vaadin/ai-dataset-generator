</g>

<g fill="#16232A">
<text x="270" y="78" text-anchor="middle" font-weight="600">Describe the domain</text>
<text x="270" y="96" text-anchor="middle" fill="#5A6A72">one paragraph, or a file</text>
<text x="730" y="66" text-anchor="middle" font-weight="600">Generate the photo, once</text>
<text x="730" y="84" text-anchor="middle" fill="#5A6A72">check --images openai</text>
<text x="730" y="102" text-anchor="middle" fill="#B8701C">paid · key from the environment</text>
<text x="1180" y="78" text-anchor="middle" font-weight="600">Answer the review queue</text>
<text x="1180" y="96" text-anchor="middle" fill="#5A6A72">review/overrides.toml</text>
<text x="1390" y="78" text-anchor="middle" font-weight="600">Publish the snapshot</text>
<text x="1390" y="96" text-anchor="middle" fill="#5A6A72">scripts/snapshot.sh · commit</text>
<text x="270" y="190" text-anchor="middle" font-weight="600">Reads AGENTS.md</text>
<text x="270" y="207" text-anchor="middle" fill="#5A6A72">guide + worked example</text>
<text x="270" y="224" text-anchor="middle" fill="#5A6A72">names the pack</text>
<text x="500" y="190" text-anchor="middle" font-weight="600">Writes the pack (data, not code)</text>
<text x="500" y="207" text-anchor="middle" fill="#5A6A72">domain · flow · pools · scenarios</text>
<text x="500" y="224" text-anchor="middle" fill="#5A6A72">checks · document templates</text>
<text x="1180" y="190" text-anchor="middle" font-weight="600">Reports</text>
<text x="1180" y="207" text-anchor="middle" fill="#5A6A72">facts, review items,</text>
<text x="1180" y="224" text-anchor="middle" fill="#5A6A72">the image command and its cost</text>
<text x="500" y="324" text-anchor="middle" font-weight="600">validate</text>
<text x="500" y="342" text-anchor="middle" fill="#5A6A72">pack structure and expressions</text>
<text x="730" y="313" text-anchor="middle" font-weight="600">generate</text>
<text x="730" y="331" text-anchor="middle" fill="#5A6A72">seeded RNG → rows, anchors</text>
<text x="730" y="348" text-anchor="middle" fill="#5A6A72">documents from templates</text>
<text x="730" y="365" text-anchor="middle" fill="#5A6A72">placeholder image unless kept</text>
<text x="960" y="313" text-anchor="middle" font-weight="600">verify + smoke tests</text>
<text x="960" y="331" text-anchor="middle" fill="#5A6A72">SQLite: rules, facts, real names</text>
<text x="960" y="348" text-anchor="middle" fill="#5A6A72">real H2 and PostgreSQL</text>
<text x="960" y="365" text-anchor="middle" fill="#5A6A72">as the read-only AI user</text>
<text x="1180" y="324" text-anchor="middle" font-weight="600">FACTS · REVIEW · ESTIMATE</text>
<text x="1180" y="342" text-anchor="middle" fill="#5A6A72">numbers, risks, predicted cost</text>
<text x="730" y="473" text-anchor="middle" font-weight="600">out/&lt;domain&gt;/</text>
<text x="730" y="491" text-anchor="middle" fill="#5A6A72">csv/ one file per table</text>
<text x="730" y="508" text-anchor="middle" fill="#5A6A72">sql/ DDL, loaders, ai_reader,</text>
<text x="730" y="525" text-anchor="middle" fill="#5A6A72">schema text · documents · manifest</text>
<text x="970" y="481" text-anchor="middle" font-weight="600">Image provider</text>
<text x="970" y="499" text-anchor="middle" fill="#5A6A72">gpt-image-1.5 + provenance</text>
<text x="970" y="516" text-anchor="middle" fill="#5A6A72">stored in the pack</text>
<text x="1390" y="473" text-anchor="middle" font-weight="600">datasets/&lt;domain&gt;/</text>
<text x="1390" y="491" text-anchor="middle" fill="#5A6A72">csv · sql · documents · FACTS</text>
<text x="1390" y="508" text-anchor="middle" fill="#5A6A72">summary.html → GitHub Pages</text>
<text x="1390" y="525" text-anchor="middle" fill="#5A6A72">H2 file rebuilt, not committed</text>
<text x="1390" y="604" text-anchor="middle" font-weight="600">Loads the CSVs</text>
<text x="1390" y="622" text-anchor="middle" fill="#5A6A72">H2 CSVREAD or psql \copy</text>
<text x="1390" y="639" text-anchor="middle" fill="#5A6A72">app user + ai_reader</text>
<text x="950" y="604" text-anchor="middle" font-weight="600">Vaadin AI components at demo time</text>
<text x="950" y="622" text-anchor="middle" fill="#5A6A72">model gets the schema text and today's date, writes SQL over the read-only connection</text>
<text x="950" y="639" text-anchor="middle" fill="#5A6A72">rows go to the grid or chart, never back to the model · contacts and widgets stay hidden</text>
</g>

