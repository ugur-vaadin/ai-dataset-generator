<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 690" role="img" aria-label="Swimlane diagram of dataset generation: a person describes a domain, a coding assistant writes a TOML pack and loops on validate and check, dsgen renders rows into CSV and SQL and verifies them, a person runs paid image generation once and answers the review queue, a snapshot is committed and served, and the demo application loads the CSVs and gives the AI a read-only connection." font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">
<rect width="1500" height="690" fill="#FFFFFF"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16232A"/></marker>
</defs>
<g fill="none" stroke="#D3DCDF">
<line x1="150" y1="140" x2="1500" y2="140"/><line x1="150" y1="260" x2="1500" y2="260"/><line x1="150" y1="430" x2="1500" y2="430"/><line x1="150" y1="560" x2="1500" y2="560"/>
<line x1="150" y1="20" x2="150" y2="680"/>
</g>
<g font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="13" fill="#16232A">
<text x="14" y="80">You</text><text x="14" y="98" font-weight="400" font-size="11.5" fill="#5A6A72">a person, any role</text>
<text x="14" y="200">Coding assistant</text><text x="14" y="218" font-weight="400" font-size="11.5" fill="#5A6A72">the LLM, your subscription</text>
<text x="14" y="340">dsgen</text><text x="14" y="358" font-weight="400" font-size="11.5" fill="#5A6A72">Python, deterministic,</text><text x="14" y="373" font-weight="400" font-size="11.5" fill="#5A6A72">no LLM calls</text>
<text x="14" y="490">Files and databases</text>
<text x="14" y="615">Demo application</text><text x="14" y="633" font-weight="400" font-size="11.5" fill="#5A6A72">Vaadin, Spring Boot</text>
</g>

<g stroke="#16232A" stroke-width="1.2">
<rect x="170" y="50" width="200" height="66" rx="4" fill="#F6E7D2"/>
<rect x="630" y="42" width="200" height="82" rx="4" fill="#F6E7D2"/>
